name: Run Automated Tests (CI)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-pipeline:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo, pdo_mysql, gd
          coverage: none

      - name: Run test runner (Fail-Fast)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ""
          DB_NAME: cms
          STORAGE_DRIVER: local
        run: php tests/run.php
