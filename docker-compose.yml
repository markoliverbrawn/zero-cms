# Self-contained local dev stack for Zero CMS.
#
#   docker compose up -d --build
#
# First boot automatically runs `bin/migrate` + `bin/seed` (see
# docker/entrypoint.sh), then the site is live at http://localhost:2370
# (admin login at /admin using ADMIN_USER / ADMIN_PASS below). Outgoing
# mail is caught by Mailpit - view it at http://localhost:8026.
#
# queue-worker/scheduler run bin/queue-runner and bin/scheduler (see README.md
# "Background Jobs & Scheduled Tasks") as always-on daemons so queued jobs and
# cron-style scheduled tasks actually run locally -- unlike the GCP deployment
# (deployments/gcp/), which instead has Cloud Scheduler HTTP-trigger the app
# every 5 minutes since Cloud Run scales to zero and can't host a daemon.
x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

x-app-env: &app-env
  ENVIRONMENT: dev
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: zero_cms
  DB_USER: root
  DB_PASS: rootpassword
  ADMIN_USER: admin
  ADMIN_PASS: password
  BASE_URL: http://localhost:2370
  BENCHMARKING: "false"
  STORAGE_DRIVER: local
  QUEUE_TRIGGER_TOKEN: dev_queue_trigger_token_change_me
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM_EMAIL: noreply@zero.cms
  SMTP_FROM_NAME: Zero CMS

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zero_cms
    volumes:
      - zero_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8026:8025"

  app:
    build: *app-build
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "2370:80"
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
    healthcheck:
      # Flips healthy once docker/entrypoint.sh's first-boot bin/seed has
      # finished (or been skipped as already-provisioned) -- queue-worker and
      # scheduler key off this so they never race app to seed the database.
      test: ["CMD-SHELL", "test -f storage/private/.provisioned"]
      interval: 5s
      timeout: 5s
      retries: 60

  queue-worker:
    build: *app-build
    restart: unless-stopped
    command: ["php", "bin/queue-runner"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html

  scheduler:
    build: *app-build
    restart: unless-stopped
    command: ["php", "bin/scheduler"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html

volumes:
  zero_mysql_data:
